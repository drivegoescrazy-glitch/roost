name: Publish release jar

on:
  push:
    paths:
      - '.github/workflows/attach-release-jar.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the jars to
        required: true
        default: v3.0.0-fabric

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || 'v3.0.0-fabric' }}
    steps:
      - uses: actions/checkout@v4
      - name: Create the release when it does not exist
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Lucraft: Core & Infinityraft (Fabric 1.21.1)" \
              --notes-file lucraftcore-fabric-1.21.1/release/RELEASE_NOTES.md
      - name: Upload the release jars
        run: gh release upload "$TAG" lucraftcore-fabric-1.21.1/release/*.jar --clobber
      - name: Show the assets
        run: gh release view "$TAG" --json assets --jq '.assets[].name'
