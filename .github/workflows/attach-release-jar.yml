name: Attach release jar

on:
  push:
    paths:
      - '.github/workflows/attach-release-jar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload jar to the v2.4.19 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v2.4.19 lucraftcore-fabric-1.21.1/release/LucraftCore-Fabric-1.21.1-2.4.19.jar --clobber
