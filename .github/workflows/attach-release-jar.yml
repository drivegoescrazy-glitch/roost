name: Publish release jars

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the jars to
        required: true
        default: v3.1.0-fabric

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || 'v3.1.0-fabric' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 8.12.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - name: Build Lucraft: Core
        run: gradle --no-daemon -p lucraftcore-fabric-1.21.1 build
      - name: Build Infinityraft
        run: gradle --no-daemon -p infinity-fabric-1.21.1 build
      - name: Create the release when it does not exist
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Lucraft: Core 3.1.0 + Infinityraft 1.13.0 (Fabric 1.21.1)" \
              --notes-file lucraftcore-fabric-1.21.1/release/RELEASE_NOTES.md
      - name: Upload the two release jars
        run: |
          gh release upload "$TAG" \
            "lucraftcore-fabric-1.21.1/build/libs/LucraftCore-Fabric-1.21.1-3.1.0.jar" \
            "infinity-fabric-1.21.1/build/libs/Infinity-Fabric-1.21.1-1.13.0.jar" \
            --clobber
      - name: Show the assets
        run: gh release view "$TAG" --json assets --jq '.assets[].name'
